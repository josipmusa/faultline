name: Image

# Tags publish; pull requests only build. Without the pull request half, a
# broken Dockerfile would not be found until the day of a release.
#
# Both architectures are built either way. They used to be built only on tags,
# because emulating arm64 took most of an hour - which meant the arm64 build
# was never exercised until the release that needed it, and that is exactly how
# v0.1.0 spent forty minutes on a build nobody had ever watched. The Dockerfile
# now cross compiles instead of emulating, so the full matrix is affordable on
# every pull request, and a regression in that shows up as the build time
# climbing back.
on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    name: build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Reading the CI conclusion for the tagged commit.
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Same gate as the release workflow: this one publishes to GHCR, so it
      # needs its own, it cannot lean on the other workflow's.
      - name: Require a green CI run
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/require-green-ci

      # Still needed: the builder stages cross compile on the native platform,
      # but the runtime stages are the target's own userspace and the
      # transparent one runs apk and setcap inside it. That is seconds of
      # emulation rather than a Next.js build's worth, so it runs on pull
      # requests too.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          # The version the binary reports is the one in the image tag, so
          # `faultline version` in a container answers for the image too. It
          # comes from the metadata step rather than the ref, which is what
          # keeps it spelled the same as the release archives: 0.1.0-rc1, with
          # no leading v.
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The transparent-mode image is the same Dockerfile's other target, on
      # alpine with iptables, published beside the default one with a
      # -transparent suffix on every tag: docs/docker.md names it that way.
      - name: Tags and labels (transparent)
        id: meta-transparent
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            suffix=-transparent,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push (transparent)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: transparent
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          build-args: VERSION=${{ steps.meta-transparent.outputs.version }}
          tags: ${{ steps.meta-transparent.outputs.tags }}
          labels: ${{ steps.meta-transparent.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The tag the metadata step resolved is the one the binary was built
      # with, so pulling it back and asking is a real check that the image
      # published and that its version was wired through, not just that the
      # push returned success.
      - name: The published image reports the released version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
          got=$(docker run --rm "$image" version)
          want="faultline ${VERSION}"
          [ "$got" = "$want" ] || { echo "::error::${image} gave '$got', wanted '$want'"; exit 1; }
          echo "$got"
