name: Release

# Tags publish; pull requests build the same artifacts and throw them away, so
# a release config that no longer works is found on a pull request rather than
# on the day of a release.
on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # The changelog is derived from the history between tags, which a
          # shallow checkout does not have.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # `make ui` runs as a GoReleaser hook, so the Node toolchain has to be
      # here before GoReleaser starts rather than inside the build.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # GoReleaser wants the key as a file, and the tap is reached over SSH, so
      # the host key goes in known_hosts here rather than being accepted blindly
      # at push time.
      - name: Set up the tap deploy key
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/homebrew_tap
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > ~/.ssh/homebrew_tap
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "HOMEBREW_TAP_DEPLOY_KEY_FILE=$HOME/.ssh/homebrew_tap" >> "$GITHUB_ENV"
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: >-
            ${{ startsWith(github.ref, 'refs/tags/')
                && 'release --clean'
                || 'release --snapshot --clean --skip=publish' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set by the step above on tags only. The snapshot run skips
          # publishing, so it never reads the key.
          HOMEBREW_TAP_DEPLOY_KEY_FILE: ${{ env.HOMEBREW_TAP_DEPLOY_KEY_FILE }}
