name: Release

# Tags publish; pull requests build the same artifacts and throw them away, so
# a release config that no longer works is found on a pull request rather than
# on the day of a release.
on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Sigstore mints a signing certificate against this token, and the
      # attestation and npm provenance are both bound to the same identity.
      id-token: write
      attestations: write
      artifact-metadata: write
      # Reading the CI conclusion for the tagged commit.
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # The changelog is derived from the history between tags, which a
          # shallow checkout does not have.
          fetch-depth: 0

      # Before anything is built, so a tag on a commit CI never passed stops
      # here rather than part way through publishing.
      - name: Require a green CI run
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/require-green-ci

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # `make ui` runs as a GoReleaser hook, so the Node toolchain has to be
      # here before GoReleaser starts rather than inside the build.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # GoReleaser shells out to cosign for the signature, so it has to be on
      # the PATH before the release starts. Pinned to an exact version because
      # this action publishes no moving major tag; dependabot keeps it current.
      - name: Set up cosign
        if: startsWith(github.ref, 'refs/tags/')
        uses: sigstore/cosign-installer@v4.1.2

      # GoReleaser wants the key as a file, and the tap is reached over SSH, so
      # the host key goes in known_hosts here rather than being accepted blindly
      # at push time.
      - name: Set up the tap deploy key
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/homebrew_tap
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > ~/.ssh/homebrew_tap
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "HOMEBREW_TAP_DEPLOY_KEY_FILE=$HOME/.ssh/homebrew_tap" >> "$GITHUB_ENV"
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: >-
            ${{ startsWith(github.ref, 'refs/tags/')
                && 'release --clean'
                || 'release --snapshot --clean --skip=publish,sign' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set by the step above on tags only. The snapshot run skips
          # publishing, so it never reads the key.
          HOMEBREW_TAP_DEPLOY_KEY_FILE: ${{ env.HOMEBREW_TAP_DEPLOY_KEY_FILE }}

      # The signature says the artifacts came from Sigstore's view of this
      # workflow; the attestation says which commit and which workflow file
      # built them, and `gh attestation verify` reads it without any extra tool
      # installed. checksums.txt names every archive, so attesting it attests
      # all of them.
      - name: Attest the archives
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-checksums: ./dist/checksums.txt

      # Always, not only on tags: this reads the same dist/ a real release
      # produces, so a packaging mistake surfaces on the pull request that made
      # it rather than on the day of a release.
      - name: Build the npm packages
        run: node npm/build.mjs

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > ~/.npmrc
          # A prerelease must not become what a bare `npm install` hands out,
          # for the same reason the tap only follows non-prereleases.
          case "$GITHUB_REF_NAME" in
          *-*) tag=next ;;
          *) tag=latest ;;
          esac
          # Platform packages before the launcher that depends on them. In the
          # other order there is a window where installing the launcher
          # resolves no binary at all.
          for dir in npm/dist/faultline-proxy-*; do
            npm publish --provenance --access public --tag "$tag" "$dir"
          done
          npm publish --provenance --access public --tag "$tag" npm/dist/faultline-proxy
