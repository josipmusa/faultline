version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - whitespace
  exclusions:
    # The UI's dependency tree happens to carry Go files. They are not ours and
    # nothing builds them: web/embed_ui.go embeds web/out, never node_modules.
    paths:
      - web/node_modules
    rules:
      - path: _test\.go$
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - web/node_modules
